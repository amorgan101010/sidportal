name: Linux build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build pkg-config git python3 \
            libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libgl1-mesa-dev \
            xvfb xauth x11-utils alsa-utils zip

      - name: Fetch JUCE 8
        run: git clone --depth 1 --branch 8.0.16-security https://github.com/juce-framework/JUCE.git "$RUNNER_TEMP/JUCE"

      - name: Configure Linux JUCE standalone, VST3, and CLI renderer
        run: >-
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=Release
          -DJUCE_DIR="$RUNNER_TEMP/JUCE"
          -DSIDPORTAL_CLI=ON

      - name: Build
        run: cmake --build build-linux --config Release --parallel 3

      - name: Run available checks
        run: xvfb-run -a ctest --test-dir build-linux --build-config Release --output-on-failure

      - name: Package Linux apps
        run: python3 tools/package_juce_platform.py linux build-linux dist

      - name: Stage VST3 sandbox host
        run: |
          mkdir -p sandbox-tests
          cp build-linux/sidportal_vst3_hostcheck_artefacts/Release/sidportal_vst3_hostcheck sandbox-tests/

      - uses: actions/upload-artifact@v4
        with:
          name: SidPortal-Linux-x86_64
          path: |
            dist/SidPortal-Linux-x86_64.zip
            dist/SidPortal-Linux-x86_64.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: SidPortal-Linux-sandbox
          path: sandbox-tests/sidportal_vst3_hostcheck

      - name: Attach package to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes || gh release view "$GITHUB_REF_NAME" >/dev/null
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/SidPortal-Linux-x86_64.zip \
            dist/SidPortal-Linux-x86_64.zip.sha256 \
            --clobber
